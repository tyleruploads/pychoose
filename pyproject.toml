[project]
name = "pychoose"
version = "0.1.0"
description = "An open-source Python GUI application built with CustomTkinter that removes the friction from everyday decision making."
readme = "README.md"
authors = [
    { name = "tyleruploads", email = "tyleruploads@yahoo.com" }
]
requires-python = ">=3.13"
dependencies = [
    "customtkinter>=6.0.0",
]

[project.scripts]
pychoose = "pychoose:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
